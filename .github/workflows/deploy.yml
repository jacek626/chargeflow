name: Deploy to DEV

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC token exchange with AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_DIR: infrastructure/environments/dev

jobs:
  deploy:
    name: Deploy to AWS DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      # ── AWS credentials via OIDC (no long-lived keys) ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── ECR login ──────────────────────────────────────────────────────────
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build and push backend services ────────────────────────────────────
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & push charging-session-service image
        working-directory: charging-session-service
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/chargeflow-dev-charging-session-service:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "CHARGING_SESSION_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build & push notification-service image
        working-directory: notification-service
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/chargeflow-dev-notification-service:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "NOTIFICATION_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # ── Build Angular frontend ─────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npx ng build --configuration=production

      # ── Terraform apply ────────────────────────────────────────────────────
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.11'
          terraform_wrapper: false  # disable wrapper so `terraform output` returns raw values

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve \
            -var "charging_session_image=${{ env.CHARGING_SESSION_IMAGE }}" \
            -var "notification_image=${{ env.NOTIFICATION_IMAGE }}" \
            -var "github_repo=${{ github.repository }}"

      # ── Capture outputs for frontend deploy ────────────────────────────────
      - name: Read Terraform outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)" >> "$GITHUB_ENV"
          echo "CF_DISTRIBUTION_ID=$(terraform output -raw frontend_cloudfront_distribution_id)" >> "$GITHUB_ENV"

      # ── Deploy frontend ────────────────────────────────────────────────────
      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/chargeflow-web/browser/ \
            "s3://${{ env.FRONTEND_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/chargeflow-web/browser/index.html \
            "s3://${{ env.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CF_DISTRIBUTION_ID }}" \
            --paths "/*"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API**: http://$(terraform output -raw alb_dns_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend**: https://$(terraform output -raw frontend_cloudfront_domain)" >> "$GITHUB_STEP_SUMMARY"
