# ChargeFlow — Local Development Infrastructure
#
# Provides:
#   postgres   — PostgreSQL 18.6  (for charging-session-service)
#   localstack — LocalStack 4.14.0 (emulates AWS: SQS, SNS, DynamoDB, SES, S3, Secrets Manager)
#
# Usage:
#   docker compose up -d          # start infrastructure in background
#   docker compose ps             # check service status
#   docker compose logs -f        # follow logs
#   docker compose down           # stop and remove containers (data is preserved)
#   docker compose down -v        # WARNING: also deletes PostgreSQL data volume
#
# Application services (charging-session-service, notification-service, frontend)
# are run directly on the host during development — not through Docker Compose.

services:

  postgres:
    image: postgres:18.6
    container_name: chargeflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargeflow}
      POSTGRES_USER: ${POSTGRES_USER:-chargeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chargeflow_local}
    ports:
      - "5432:5432"
    volumes:
      - chargeflow-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chargeflow} -d ${POSTGRES_DB:-chargeflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0
    container_name: chargeflow-localstack
    ports:
      - "4566:4566"
    environment:
      - DEFAULT_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  chargeflow-postgres-data:
    name: chargeflow-postgres-data
