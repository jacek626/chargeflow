spring:
  application:
    name: charging-session-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chargeflow}
    username: ${DB_USERNAME:chargeflow}
    password: ${DB_PASSWORD:chargeflow}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Jackson 3.x (Spring Boot 4.x): WRITE_DATES_AS_TIMESTAMPS moved to DateTimeFeature
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # LocalStack default — overridden by COGNITO_JWKS_URI env var in DEV/PROD
          jwk-set-uri: ${COGNITO_JWKS_URI:http://localhost:4566/eu-central-1_local/.well-known/jwks.json}

chargeflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  aws:
    region: ${AWS_REGION:eu-central-1}
    endpoint-url: ${AWS_ENDPOINT_URL:}
  sns:
    enabled: ${SNS_ENABLED:false}
    topic-arn: ${SNS_TOPIC_ARN:}
  outbox:
    poll-interval-ms: 5000

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  info:
    env:
      enabled: true

info:
  app:
    name: charging-session-service
    version: v1

server:
  port: 8080
